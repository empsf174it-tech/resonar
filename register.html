<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <title>Register | Resonar</title>

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

    <a href="index.html" class="auth-back"><i class="ph ph-arrow-left"></i> Back to store</a>

    <main class="auth-card">
        <a href="index.html" class="auth-logo" aria-label="Resonar home">
            <i class="ph ph-waveform"></i> Resonar
        </a>

        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Join the Resonar creator community</p>
        </div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Jane Doe" autocomplete="name" required>
                    <div class="error-msg"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="creator@example.com" autocomplete="email" required>
                    <div class="error-msg"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" class="form-control" placeholder="Min 8 characters" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><i class="ph ph-eye"></i></button>
                    </div>
                    <div class="error-msg"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password</label>
                    <div class="password-field">
                        <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><i class="ph ph-eye"></i></button>
                    </div>
                    <div class="error-msg"></div>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#" class="auth-link">Terms of Service</a> and Privacy Policy.</label>
                </div>
                <div class="error-msg" style="margin-bottom: var(--space-3);"></div>

                <button type="submit" class="btn auth-submit" style="margin-top: var(--space-4);">Create Account</button>
            </form>

        <div class="auth-divider">or</div>

        <div class="social-login">
            <button type="button" class="social-btn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Continue with Google</button>
            <button type="button" class="social-btn"><i class="ph-fill ph-apple-logo"></i> Continue with Apple</button>
        </div>

        <p class="auth-switch">Already have an account? <a href="login.html" class="auth-link">Login here</a></p>
        <p class="auth-secure"><i class="ph-fill ph-lock-key"></i> Secure, encrypted connection</p>
    </main>

    <!-- Scripts -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
